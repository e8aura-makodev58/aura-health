<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc"><title id="title">Safety policy has the final say</title><desc id="desc">Safety-relevant patient inputs are assessed before conversational generation. Detectors propose resolved evidence; deterministic policy decides safety state. Safety overrides ordinary longitudinal communication. Resources are pinned independently with built-in fallback and local offline containment.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#6b6258"></path></marker><style>text{font-family:Arial,sans-serif;fill:#2a2320}.title{font-size:54px;font-weight:700}.sub{font-size:27px;fill:#6b6258}.label{font-size:28px;font-weight:700}.body{font-size:25px}.small{font-size:23px;fill:#6b6258}.flow{fill:none;stroke:#6b6258;stroke-width:3;marker-end:url(#arrow)}</style></defs><rect width="1920" height="1080" fill="#fbfaf7"></rect><text x="80" y="92" class="title">Safety policy has the final say</text><text x="80" y="142" class="sub">Challenge 2 · Scenario 1: mental health maintenance for working adults on antidepressants</text><g data-fit="300"><rect x="80" y="225" width="350" height="180" rx="22" fill="#f4f1ea"></rect><text x="105" y="273" class="label">Patient input</text><text x="105" y="319" class="body" style="font-size: 22px;">Free text / structured input</text><text x="105" y="358" class="body" style="font-size: 23px;">Safety-relevant path first</text></g><g data-fit="450"><rect x="530" y="225" width="500" height="180" rx="22" fill="#e9e1f4"></rect><text x="555" y="273" class="label">Safety gate + proposals</text><text x="555" y="319" class="body">Rules / demo classifier → signals</text><text x="555" y="358" class="body" style="font-size: 24px;">A detector cannot lower safety state</text></g><g data-fit="660"><rect x="1130" y="225" width="710" height="180" rx="22" fill="#fde4df"></rect><text x="1155" y="273" class="label">Deterministic aura_safety controller</text><text x="1155" y="319" class="body">State validity → transitions → CAS → actions</text><text x="1155" y="358" class="body">T0–T4; fail closed is a separate degraded overlay</text></g><path d="M430 312H520" class="flow"></path><path d="M1030 312H1120" class="flow"></path><g data-fit="450"><rect x="80" y="500" width="500" height="190" rx="22" fill="#dceef7"></rect><text x="105" y="548" class="label">Longitudinal communication</text><text x="105" y="594" class="body">Stay quiet / check-in / clarification</text><text x="105" y="633" class="body" style="font-size: 22px;">Descriptive personal changes + context</text></g><g data-fit="550"><rect x="680" y="500" width="600" height="190" rx="22" fill="#fde4df"></rect><text x="705" y="548" class="label" style="font-size: 23px;">Safety overrides ordinary communication</text><text x="705" y="594" class="body">Apply authoritative state + actions</text><text x="705" y="633" class="body">The application does not assign safety tiers</text></g><path d="M580 592H670" class="flow"></path><path d="M1440 405V447H980V490" class="flow"></path><g data-fit="1150"><rect x="80" y="785" width="1200" height="180" rx="22" fill="#f4f1ea"></rect><text x="105" y="833" class="label">Render the allowed interaction</text><text x="105" y="879" class="body">Approved wording + checks + fallback where generation is permitted</text><text x="105" y="918" class="body">T4 / degraded / offline fail closed → no LLM; fixed text and local containment</text></g><path d="M980 690V775" class="flow"></path><g data-fit="390"><rect x="1400" y="500" width="440" height="190" rx="22" fill="#fde4df"></rect><text x="1425" y="548" class="label" style="font-size: 26px;">Registry + built-in bundle</text><text x="1425" y="594" class="body">Lookup failure → fallback</text><text x="1425" y="633" class="body" style="font-size: 23px;">Old bundle stays visible + notice</text></g><path d="M1620 405V490" class="flow"></path><g data-fit="390"><rect x="1400" y="785" width="440" height="180" rx="22" fill="#fde4df"></rect><text x="1425" y="833" class="label">Pinned safety resources</text><text x="1425" y="879" class="body">Visible outside generated text</text><text x="1425" y="918" class="body">Display never waits for an LLM</text></g><path d="M1620 690V775" class="flow"></path><text x="80" y="1032" class="small">Engineering demonstration · resource content still needs review · no emergency monitoring or suicide-risk determination</text></svg>
