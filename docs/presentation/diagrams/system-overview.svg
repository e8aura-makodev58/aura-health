<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc"><title id="title">AURA Health · system architecture</title><desc id="desc">Browser inputs reach a Python application that owns deterministic longitudinal and safety state. A bounded agent reads committed evidence through scoped tools and uses a live model on synthetic data. Repository interfaces isolate SQLite. Only observable events cross from evaluation; hidden truth stays outside decisions.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#6b6258"></path></marker><style>text{font-family:Arial,sans-serif;fill:#2a2320}.title{font-size:54px;font-weight:700}.sub{font-size:27px;fill:#6b6258}.label{font-size:28px;font-weight:700}.body{font-size:25px}.small{font-size:23px;fill:#6b6258}.flow{fill:none;stroke:#6b6258;stroke-width:3;marker-end:url(#arrow)}</style></defs><rect width="1920" height="1080" fill="#fbfaf7"></rect><text x="80" y="92" class="title">AURA Health · system architecture</text><text x="80" y="142" class="sub">Challenge 2 · Scenario 1: mental health maintenance for working adults on antidepressants</text><g data-fit="275"><rect x="80" y="195" width="325" height="480" rx="22" fill="#fff" stroke="#dad4ca" stroke-width="2" stroke-dasharray="10 8"></rect><text x="105" y="239" class="label">Web experience</text></g><g data-fit="225"><rect x="105" y="270" width="275" height="135" rx="22" fill="#f4f1ea"></rect><text x="130" y="318" class="label">Patient view</text><text x="130" y="364" class="body">Recap, check-ins</text><text x="130" y="403" class="body" style="font-size: 24px;">Routine, visit note</text></g><g data-fit="225"><rect x="105" y="430" width="275" height="145" rx="22" fill="#f4f1ea"></rect><text x="130" y="478" class="label" style="font-size: 27px;">Clinician demo</text><text x="130" y="524" class="body">Charts and Q&amp;A</text><text x="130" y="563" class="body">Synthetic record</text></g><text x="105" y="620" class="small">Presentation only;</text><text x="105" y="651" class="small">no domain policy in UI</text><g data-fit="580"><rect x="475" y="195" width="630" height="480" rx="22" fill="#fff" stroke="#dad4ca" stroke-width="2" stroke-dasharray="10 8"></rect><text x="500" y="239" class="label">Python application · state authority</text></g><g data-fit="530"><rect x="500" y="270" width="580" height="110" rx="22" fill="#dceef7"></rect><text x="525" y="318" class="label">FastAPI → application services</text><text x="525" y="364" class="body" style="font-size: 21px;">Consent, idempotency, atomic event processing</text></g><g data-fit="230"><rect x="500" y="405" width="280" height="150" rx="22" fill="#dceef7"></rect><text x="525" y="453" class="label">Longitudinal</text><text x="525" y="499" class="body">Anchor + rolling</text><text x="525" y="538" class="body" style="font-size: 22px;">Context, gaps, holds</text></g><g data-fit="230"><rect x="800" y="405" width="280" height="150" rx="22" fill="#fde4df"></rect><text x="825" y="453" class="label">Safety engine</text><text x="825" y="499" class="body">Evidence → rules</text><text x="825" y="538" class="body">T0–T4, fail closed</text></g><text x="500" y="602" class="body">Communication intent + committed evidence</text><text x="500" y="643" class="small">Safety takes precedence; models do not own state</text><g data-fit="615"><rect x="1175" y="195" width="665" height="480" rx="22" fill="#fff" stroke="#dad4ca" stroke-width="2" stroke-dasharray="10 8"></rect><text x="1200" y="239" class="label">Bounded AI · read-only investigation</text></g><g data-fit="565"><rect x="1200" y="270" width="615" height="120" rx="22" fill="#e9e1f4"></rect><text x="1225" y="318" class="label">Aura-Agent + patient-scoped tools</text><text x="1225" y="364" class="body" style="font-size: 23px;">Model chooses tools, windows and comparisons</text></g><g data-fit="565"><rect x="1200" y="410" width="615" height="120" rx="22" fill="#e9e1f4"></rect><text x="1225" y="458" class="label">Ground → verify → recheck</text><text x="1225" y="504" class="body">Cited answer / grounded fallback + trace</text></g><text x="1200" y="581" class="body">Live model gateway · synthetic inputs only</text><text x="1200" y="620" class="small">DeepSeek active; provider configurable</text><text x="1200" y="651" class="small">Verifier is a separate call, not clinical validation</text><path d="M405 321H470" class="flow"></path><path d="M1105 329H1170" class="flow"></path><path d="M640 380V399" class="flow"></path><path d="M940 380V399" class="flow"></path><path d="M1500 390V404" class="flow"></path><rect x="80" y="730" width="670" height="215" rx="22" fill="#fff0cf" stroke="#d4a943" stroke-width="2" stroke-dasharray="10 8"></rect><text x="105" y="773" class="label">Separate simulation / evaluation plane</text><text x="105" y="814" class="body">Structured plans → seeded synthetic observations</text><text x="105" y="853" class="body">Only observable events enter application inputs</text><text x="105" y="897" class="small">Hidden labels and expected outcomes stay here</text><path d="M750 774H790V680" class="flow"></path><g data-fit="410"><rect x="820" y="730" width="460" height="215" rx="22" fill="#f4f1ea"></rect><text x="845" y="778" class="label">Repository boundary</text><text x="845" y="824" class="body">Development SQLite</text><text x="845" y="863" class="body">Typed events, state, results</text><text x="845" y="902" class="body" style="font-size: 21px;">Linked audits + immutable run traces</text></g><path d="M1005 675V724" class="flow"></path><g data-fit="440"><rect x="1350" y="730" width="490" height="215" rx="22" fill="#fde4df"></rect><text x="1375" y="778" class="label">Independent safety display</text><text x="1375" y="824" class="body" style="font-size: 24px;">Pinned resources + built-in fallback</text><text x="1375" y="863" class="body">Outside generated text</text><text x="1375" y="902" class="body">Does not rely on live lookup alone</text></g><path d="M1080 500H1135V700H1580V724" class="flow"></path><text x="80" y="1004" class="sub">Signals propose. Rules dispose. The LLM phrases.</text><text x="80" y="1044" class="small">Implemented demo · one application deployment · development storage · institutional hosting is future work</text></svg>
