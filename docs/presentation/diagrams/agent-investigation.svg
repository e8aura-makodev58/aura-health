<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc"><title id="title">Aura-Agent · investigate, cite, check</title><desc id="desc">Permitted questions enter a bounded model/tool loop. The model chooses tools and windows, receives scoped facts, and drafts cited claims. Deterministic grounding, a separate verifier call and a fresh-state check control the answer. Patient questions are safety-gated first.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#6b6258"></path></marker><style>text{font-family:Arial,sans-serif;fill:#2a2320}.title{font-size:54px;font-weight:700}.sub{font-size:27px;fill:#6b6258}.label{font-size:28px;font-weight:700}.body{font-size:25px}.small{font-size:23px;fill:#6b6258}.flow{fill:none;stroke:#6b6258;stroke-width:3;marker-end:url(#arrow)}</style></defs><rect width="1920" height="1080" fill="#fbfaf7"></rect><text x="80" y="92" class="title">Aura-Agent · investigate, cite, check</text><text x="80" y="142" class="sub">Challenge 2 · Scenario 1: mental health maintenance for working adults on antidepressants</text><g data-fit="1710"><rect x="80" y="200" width="1760" height="110" rx="22" fill="#f4f1ea"></rect><text x="105" y="248" class="label">“When did sleep timing change, and was anything reported around then?”</text></g><text x="105" y="282" class="small">Clinician questions are not patient testimony. Patient-authored questions are safety-gated first.</text><g data-fit="450"><rect x="80" y="370" width="500" height="205" rx="22" fill="#dceef7"></rect><text x="105" y="418" class="label">1 · Approve the request</text><text x="105" y="464" class="body" style="font-size: 24px;">Skill, selected patient, current safety</text><text x="105" y="503" class="body" style="font-size: 23px;">Read-only record + permitted window</text><text x="105" y="542" class="body">Application boundary / guard</text></g><g data-fit="450"><rect x="710" y="370" width="500" height="205" rx="22" fill="#e9e1f4"></rect><text x="735" y="418" class="label">2 · Model chooses a step</text><text x="735" y="464" class="body" style="font-size: 22px;">Which tool? Which dates? Which signal?</text><text x="735" y="503" class="body">Read more or prepare a cited draft</text><text x="735" y="542" class="body">Bounded model / tool loop</text></g><g data-fit="450"><rect x="1340" y="370" width="500" height="205" rx="22" fill="#dceef7"></rect><text x="1365" y="418" class="label">3 · Execute scoped tools</text><text x="1365" y="464" class="body" style="font-size: 24px;">Series, context, gaps, routine records</text><text x="1365" y="503" class="body" style="font-size: 23px;">Compare windows / weekday patterns</text><text x="1365" y="542" class="body" style="font-size: 23px;">Return facts, sources and calculations</text></g><path d="M580 464H700" class="flow"></path><path d="M1210 464H1330" class="flow"></path><path d="M1585 370V337H960V362" class="flow"></path><text x="1245" y="326" class="small">Tool facts → next model step</text><g data-fit="450"><rect x="80" y="700" width="500" height="205" rx="22" fill="#e9e1f4"></rect><text x="105" y="748" class="label">4 · Ground and verify</text><text x="105" y="794" class="body" style="font-size: 24px;">Exact facts, citations, allowed claims</text><text x="105" y="833" class="body" style="font-size: 22px;">Separate model call checks statements</text><text x="105" y="872" class="body">Reject unsupported output</text></g><g data-fit="450"><rect x="710" y="700" width="500" height="205" rx="22" fill="#dceef7"></rect><text x="735" y="748" class="label">5 · Recheck current state</text><text x="735" y="794" class="body" style="font-size: 22px;">Has the record or safety state changed?</text><text x="735" y="833" class="body">Show permitted answer or fallback</text><text x="735" y="872" class="body">Unsafe / stale results are withheld</text></g><g data-fit="450"><rect x="1340" y="700" width="500" height="205" rx="22" fill="#f4f1ea"></rect><text x="1365" y="748" class="label">6 · Persist and display</text><text x="1365" y="794" class="body" style="font-size: 23px;">Answer, sources and investigation trail</text><text x="1365" y="833" class="body" style="font-size: 24px;">Model / prompt versions + run audit</text><text x="1365" y="872" class="body" style="font-size: 22px;">No care-action or treatment-write tools</text></g><path d="M960 575V630H330V690" class="flow"></path><text x="1010" y="638" class="small">Cited draft when ready</text><path d="M580 796H700" class="flow"></path><path d="M1210 796H1330" class="flow"></path><text x="80" y="981" class="sub">Engineering limits: 8 model steps · 24 tool calls · 50-second run budget</text><text x="80" y="1029" class="small">Failure uses source-based fallback. Trace shows actions, not hidden reasoning. Verification is not clinical validation.</text></svg>
